const grid=document.getElementById('grid');
const count=document.getElementById('count');
const empty=document.getElementById('empty');
const search=document.getElementById('search');
const group=document.getElementById('group');
let variant='focus';
function render() {
  const query=search.value.trim().toLocaleLowerCase();
  const selected=rows.filter(row=>(!group.value||row.group===group.value)&&(!query||row.title.toLocaleLowerCase().includes(query)));
  grid.replaceChildren();
  for (const row of selected) {
    const url=`./${variant}/${row.id}.jpg?v=${variant==='focus'?row.focus_v:row.full_v}`;
    const card=document.createElement('article'); card.className='card';
    const link=document.createElement('a'); link.href=url; link.style.aspectRatio=variant==='focus'?(row.focus_ratio||2.4):16/9; link.target='_blank'; link.rel='noopener'; link.setAttribute('aria-label',`Open ${row.title} image`);
    const img=document.createElement('img'); img.src=url; img.loading='lazy'; img.alt=`${row.title} background`;
    const caption=document.createElement('div'); caption.className='caption';
    const title=document.createElement('div'); title.className='title'; title.textContent=row.title;
    const category=document.createElement('div'); category.className='group'; category.textContent=row.group;
    link.append(img); caption.append(title,category); card.append(link,caption); grid.append(card);
  }
  count.textContent=`${selected.length} of ${rows.length}`;
  empty.hidden=selected.length!==0;
}
search.addEventListener('input',render);
group.addEventListener('change',render);
for (const choice of ['focus','full']) document.getElementById(choice).addEventListener('click',()=>{
  variant=choice;
  for (const value of ['focus','full']) {
    const active=value===variant;
    const button=document.getElementById(value);
    button.classList.toggle('active',active);
    button.setAttribute('aria-pressed',String(active));
  }
  render();
});
render();
</script>
